name: Test - SHA Caller (verifies reusable workflow SHA context)
on:
  workflow_dispatch:

jobs:
  caller-context:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== SHA values inside the CALLING workflow ==="
          echo "github.workflow_sha  = ${{ github.workflow_sha }}"
          echo "github.sha           = ${{ github.sha }}"

  call-probe:
    uses: syntasso/ci/.github/workflows/test-sha-probe.yaml@fix/auto-merge-gh-pr-checks-fallback
    secrets: inherit

  compare:
    needs: [caller-context, call-probe]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Comparison ==="
          echo "Probe reported github.workflow_sha = ${{ needs.call-probe.outputs.workflow_sha }}"
          echo "Probe reported github.sha          = ${{ needs.call-probe.outputs.github_sha }}"
          echo ""
          echo "If workflow_sha != github_sha inside the probe, it is specific to the"
          echo "called workflow file, not the trigger commit — our assumption is correct."
