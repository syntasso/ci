name: Experiment - Release candidate

# Part of the automated releases experiment (syntasso/enterprise-kratix#1640).
#
# Runs on a component's release-please PR. Builds the image once, pushes it as
# candidate-<PR head commit>, and scans it with Snyk. If the scan fails, this check fails.
# experiment-release-publish.yaml later gives this exact image its release tag.
#
# Call it with `secrets: inherit`. It uses GHCR_TOKEN, SNYK_TOKEN and
# EXPERIMENT_RELEASES_SLACK_WEBHOOK_URL.

on:
  workflow_call:
    inputs:
      component:
        description: The release-please component, e.g. ske-portal-controller
        type: string
        required: true
      image:
        description: The image name without a tag, e.g. ghcr.io/syntasso/ske-portal-controller
        type: string
        required: true
      context:
        description: The Docker build context, relative to the repo root
        type: string
        required: true
      dockerfile:
        description: The Dockerfile, relative to the repo root
        type: string
        required: true
      build-contexts:
        description: Extra named build contexts, one name=path per line
        type: string
        default: ''

jobs:
  candidate:
    name: Build and scan
    # Call this on every PR, with no condition in the caller. This job then skips itself on
    # other PRs, and a skipped job passes. If the caller skipped instead, the check would
    # get a different name and a required check would wait forever on every other PR.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == format('release-please--branches--main--components--{0}', inputs.component) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      # A new commit on the release PR makes the old run pointless.
      group: experiment-release-candidate-${{ inputs.component }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CANDIDATE: ${{ inputs.image }}:candidate-${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the release PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the PR commit itself, not GitHub's temporary merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the candidate, unless it already exists
        env:
          IMAGE: ${{ inputs.image }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_CONTEXTS: ${{ inputs.build-contexts }}
        run: |
          if docker buildx imagetools inspect "$CANDIDATE" > /dev/null 2>&1; then
            echo "$CANDIDATE already exists, so it is not built again. It is still scanned below."
            exit 0
          fi

          build_context_args=()
          while read -r build_context; do
            if [ -n "$build_context" ]; then
              build_context_args+=(--build-context "$build_context")
            fi
          done <<< "$BUILD_CONTEXTS"

          # Reuse layers from earlier builds, such as the builder stage installing Go.
          build_cache="$IMAGE:buildcache"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file "$DOCKERFILE" \
            --tag "$CANDIDATE" \
            --cache-from "type=registry,ref=$build_cache" \
            --cache-to "type=registry,ref=$build_cache,mode=max" \
            --push \
            "${build_context_args[@]}" \
            "$CONTEXT"

      - name: Find the candidate digest
        id: candidate
        run: |
          digest=$(docker buildx imagetools inspect "$CANDIDATE" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Candidate digest: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Scan linux/amd64
        id: scan-amd64
        uses: snyk/actions/docker@11b673cfb4b0dc0d860a1323caa199d54950dcce # master (no stable release)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ inputs.image }}@${{ steps.candidate.outputs.digest }}
          args: --platform=linux/amd64 --severity-threshold=high --policy-path=.snyk --username=syntassodev --password=${{ secrets.GHCR_TOKEN }}

      - name: Scan linux/arm64
        id: scan-arm64
        uses: snyk/actions/docker@11b673cfb4b0dc0d860a1323caa199d54950dcce # master (no stable release)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ inputs.image }}@${{ steps.candidate.outputs.digest }}
          args: --platform=linux/arm64 --severity-threshold=high --policy-path=.snyk --username=syntassodev --password=${{ secrets.GHCR_TOKEN }}

      # Quiet when the candidate passes. Only tell people when the release is blocked.
      - name: Tell the experiment channel the release is blocked
        if: failure()
        env:
          WEBHOOK: ${{ secrets.EXPERIMENT_RELEASES_SLACK_WEBHOOK_URL }}
          COMPONENT: ${{ inputs.component }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SCAN_FAILED: ${{ steps.scan-amd64.outcome == 'failure' || steps.scan-arm64.outcome == 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          version="${PR_TITLE##* }"
          if [ "$SCAN_FAILED" = true ]; then
            message=":octagonal_sign: *$COMPONENT v$version is blocked: Snyk found high severity vulnerabilities*
          Release PR <$PR_URL|#$PR_NUMBER> can't merge. Fix it on \`main\`, or accept the CVEs in \`.snyk\` with a reason and an expiry date. <$RUN_URL|Scan results>"
          else
            message=":octagonal_sign: *$COMPONENT v$version is blocked: the candidate build failed*
          Release PR <$PR_URL|#$PR_NUMBER> can't merge until it builds. <$RUN_URL|Build log>"
          fi
          curl -sSf -X POST -H 'Content-type: application/json' --data "$(jq -n --arg text "$message" '{text: $text}')" "$WEBHOOK"
