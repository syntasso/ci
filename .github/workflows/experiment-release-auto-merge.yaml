name: Experiment - Release auto-merge

# Part of the automated releases experiment (syntasso/enterprise-kratix#1681).
#
# Merges a component's release-please PR once it is safe. Run it after each candidate
# check finishes and after every push to main. It merges only when:
#
#   1. every required check has passed on the PR's current commit, and
#   2. nothing on main has changed the component's files since the PR was built.
#
# The required checks are the required-checks input, or if that is empty, the required
# checks of the ruleset on main. With no checks at all, it refuses to merge.
#
# If main has changed the component, the scanned image is missing that change. So the job
# waits: release-please updates the PR (set always-update: true), a new candidate is built
# and scanned, and the next run merges it.
#
# It merges with --match-head-commit and never with --admin, so a ruleset on main, if there
# is one, still applies.
#
# Call it with `secrets: inherit`. It uses RELEASE_PLEASE_TOKEN (a merge with GITHUB_TOKEN
# would not start the tag workflow) and EXPERIMENT_RELEASES_SLACK_WEBHOOK_URL.

on:
  workflow_call:
    inputs:
      component:
        description: The release-please component, e.g. ske-portal-controller
        type: string
        required: true
      paths:
        description: Folders that go into the image, one per line, e.g. ske-portal-controller/ and ske-operator/
        type: string
        required: true
      required-checks:
        description: >-
          Optional. The checks that must pass before merging, one per line, e.g.
          "candidate / Build and scan". When empty, the required checks of the ruleset on main are used.
        type: string
        default: ''

jobs:
  merge:
    name: Merge the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: experiment-release-auto-merge-${{ inputs.component }}
      cancel-in-progress: false
    env:
      COMPONENT: ${{ inputs.component }}
      IMAGE_PATHS: ${{ inputs.paths }}
      REQUIRED_CHECKS: ${{ inputs.required-checks }}
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Merge the release PR if it is safe
        id: merge
        run: |
          release_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "release-please--branches--main--components--$COMPONENT" \
            --json number,headRefOid --jq '.[0] // empty')
          if [ -z "$release_pr" ]; then
            echo "No open $COMPONENT release PR."
            exit 0
          fi
          number=$(jq -r .number <<< "$release_pr")
          head_sha=$(jq -r .headRefOid <<< "$release_pr")
          echo "Release PR #$number is at $head_sha."

          # 1. Has main changed the component since the PR was built? This lists the files
          # changed on main since the commit the PR is based on.
          changed_on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/$head_sha...main" --jq '.files[].filename')
          if [ "$(wc -l <<< "$changed_on_main")" -ge 300 ]; then
            echo "Too many files changed on main to check, so waiting for release-please to update the PR."
            exit 0
          fi
          while read -r image_path; do
            if [ -z "$image_path" ]; then
              continue
            fi
            if awk -v folder="$image_path" 'index($0, folder) == 1 { found = 1 } END { exit !found }' <<< "$changed_on_main"; then
              echo "main has changed $image_path since release PR #$number was built. Waiting for release-please to update it."
              exit 0
            fi
          done <<< "$IMAGE_PATHS"

          # 2. Have all the required checks passed on this exact commit?
          required_checks=$(sed '/^[[:space:]]*$/d' <<< "$REQUIRED_CHECKS")
          if [ -z "$required_checks" ]; then
            required_checks=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
              --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | unique | .[]')
          fi
          if [ -z "$required_checks" ]; then
            problem="no required checks are set, so it is not safe to auto-merge. Pass required-checks, or add a ruleset on main that requires the candidate check."
            echo "::error::$problem"
            echo "problem=$problem" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          check_runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?per_page=100")
          while read -r check; do
            result=$(jq -r --arg name "$check" '
              [.check_runs[] | select(.name == $name)] | sort_by(.started_at) | last
              | if . == null then "missing"
                elif .status != "completed" then "pending"
                elif (.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral") then "pass"
                else "fail" end' <<< "$check_runs")
            if [ "$result" = "fail" ]; then
              echo "'$check' failed on release PR #$number. Waiting for a fix to land on main. The overdue alert fires if this takes too long."
              exit 0
            fi
            if [ "$result" != "pass" ]; then
              echo "'$check' is $result on release PR #$number. The next run carries on."
              exit 0
            fi
            echo "'$check': passed"
          done <<< "$required_checks"

          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$head_sha"
          echo "Merged release PR #$number."

      # Quiet when it merges: the "is out" message comes from the publish workflow.
      # Only tell people when it fails.
      - name: Tell the experiment channel the auto-merge failed
        if: failure()
        env:
          WEBHOOK: ${{ secrets.EXPERIMENT_RELEASES_SLACK_WEBHOOK_URL }}
          PROBLEM: ${{ steps.merge.outputs.problem || 'the release PR could not be merged' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          message=":octagonal_sign: *$COMPONENT release auto-merge failed*
          ${PROBLEM^}. <$RUN_URL|Run log>"
          curl -sSf -X POST -H 'Content-type: application/json' --data "$(jq -n --arg text "$message" '{text: $text}')" "$WEBHOOK"
