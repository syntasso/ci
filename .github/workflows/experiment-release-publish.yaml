name: Experiment - Release publish

# Part of the automated releases experiment (syntasso/enterprise-kratix#1640).
#
# Runs when release-please pushes a component's release tag. Finds the candidate image
# that experiment-release-candidate.yaml built and scanned for the merged release PR, and
# gives it the release tag. It never builds the image again.
#
# Safe to re-run. Image tags are never overwritten. Release files (the SBOMs, and any files
# from release-files-command) are made from the same image digest and tagged source, so
# uploading them again gives the same content.
#
# Call it with `secrets: inherit`. It uses EXPERIMENT_RELEASES_SLACK_WEBHOOK_URL, and
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (or the *_FOR_RELEASES ones) when no
# aws-role-arn is given.

on:
  workflow_call:
    inputs:
      component:
        description: The release-please component, e.g. ske-portal-controller. Also its key in .release-please-manifest.json.
        type: string
        required: true
      image:
        description: The image name without a tag, e.g. ghcr.io/syntasso/ske-portal-controller
        type: string
        required: true
      tag:
        description: The git tag release-please created, e.g. ske-portal-controller-v1.2.3
        type: string
        required: true
      bucket:
        description: The S3 bucket for release files
        type: string
        required: true
      bucket-path:
        description: Optional. Release files go in <bucket>/<bucket-path>/vX.Y.Z/. Defaults to the component, e.g. aspects/ske-tfstate-finder
        type: string
        default: ''
      aws-role-arn:
        description: >-
          Optional. The AWS role to assume (with GitHub OIDC) to write to the bucket. When empty,
          the AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets are used instead, or the
          AWS_ACCESS_KEY_ID_FOR_RELEASES and AWS_SECRET_ACCESS_KEY_FOR_RELEASES ones if those are not set.
        type: string
        default: ''
      release-files-command:
        description: >-
          Optional. A command that makes more release files, such as an installer. It runs from the
          repo root at the release tag, with VERSION set to vX.Y.Z.
        type: string
        default: ''
      release-files:
        description: Optional. The files that release-files-command makes, one per line, relative to the repo root
        type: string
        default: ''
      go-version:
        description: Optional. Set up this Go version before running release-files-command
        type: string
        default: ''

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      # To find the release PR that the tag's commit came from.
      pull-requests: read
    concurrency:
      group: experiment-release-publish-${{ inputs.component }}
      cancel-in-progress: false
    env:
      COMPONENT: ${{ inputs.component }}
      IMAGE: ${{ inputs.image }}
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the scanned candidate for this tag
        id: candidate
        run: |
          version="${TAG#"$COMPONENT"-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a $COMPONENT-vX.Y.Z tag"
            exit 1
          fi

          merge_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          release_branch="release-please--branches--main--components--$COMPONENT"
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$merge_sha/pulls" \
            --jq "[.[] | select(.merged_at != null and .head.ref == \"$release_branch\")][0].head.sha // empty")
          if [ -z "$source_sha" ]; then
            echo "::error::$TAG does not point at a merged $COMPONENT release PR"
            exit 1
          fi

          if ! digest=$(docker buildx imagetools inspect "$IMAGE:candidate-$source_sha" --format '{{json .Manifest}}' | jq -r .digest); then
            echo "::error::No candidate image for release PR commit $source_sha. Refusing to build a new one."
            exit 1
          fi

          echo "Publishing $IMAGE@$digest (candidate-$source_sha) as v$version"
          {
            echo "version=$version"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      # Make the extra release files before tagging anything, so a broken build publishes nothing.
      - name: Checkout the release tag
        if: inputs.release-files-command != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: source
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.go-version != ''
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - name: Make the extra release files from the tagged source
        if: inputs.release-files-command != ''
        working-directory: source
        env:
          VERSION: v${{ steps.candidate.outputs.version }}
          RELEASE_FILES_COMMAND: ${{ inputs.release-files-command }}
          RELEASE_FILES: ${{ inputs.release-files }}
        run: |
          bash -eo pipefail -c "$RELEASE_FILES_COMMAND"
          while read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            if [ ! -s "$file" ]; then
              echo "::error::The release files command did not make $file."
              exit 1
            fi
            cp "$file" "$GITHUB_WORKSPACE/"
            echo "Made ${file##*/}"
          done <<< "$RELEASE_FILES"

      - name: Give the candidate its release tag, never overwriting
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          release_image="$IMAGE:v$VERSION"
          if ! existing=$(docker buildx imagetools inspect "$release_image" --format '{{json .Manifest}}' 2>&1); then
            if grep -qiE "not found|manifest unknown" <<< "$existing"; then
              docker buildx imagetools create --tag "$release_image" "$IMAGE@$DIGEST"
              exit 0
            fi
            echo "$existing"
            exit 1
          fi

          existing_digest=$(jq -r .digest <<< "$existing")
          if [ "$existing_digest" != "$DIGEST" ]; then
            echo "::error::$release_image already points at $existing_digest, not the scanned $DIGEST. Refusing to overwrite it."
            exit 1
          fi
          echo "$release_image already points at the scanned image."

      - name: Move latest, unless a newer version has been merged
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          version_on_main=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=main" \
            | jq -r --arg component "$COMPONENT" '.[$component]')
          if [ "$version_on_main" != "$VERSION" ]; then
            echo "main is on $version_on_main, so latest stays where it is."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

      - name: Make the SBOMs from the published image
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          # Go binaries don't record module licences, so look them up via the Go module proxy.
          SYFT_GOLANG_SEARCH_REMOTE_LICENSES: "true"
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft "registry:$IMAGE@$DIGEST" --platform linux/amd64 -o "syft-json=$COMPONENT-sbom.json"
          syft "registry:$IMAGE@$DIGEST" --platform linux/arm64 -o "syft-json=$COMPONENT-arm64-sbom.json"

      - name: Log in to AWS with the role
        if: inputs.aws-role-arn != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ inputs.aws-role-arn }}
      - name: Log in to AWS with access keys
        if: inputs.aws-role-arn == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID_FOR_RELEASES }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY_FOR_RELEASES }}

      - name: Upload the release files
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          BUCKET: ${{ inputs.bucket }}
          BUCKET_PATH: ${{ inputs.bucket-path || inputs.component }}
          RELEASE_FILES: ${{ inputs.release-files }}
        run: |
          files=("$COMPONENT-sbom.json" "$COMPONENT-arm64-sbom.json")
          while read -r file; do
            if [ -n "$file" ]; then
              files+=("${file##*/}")
            fi
          done <<< "$RELEASE_FILES"

          for file in "${files[@]}"; do
            aws s3 cp "$file" "s3://$BUCKET/$BUCKET_PATH/v$VERSION/$file"
          done
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Tell the experiment channel the release is out
        env:
          WEBHOOK: ${{ secrets.EXPERIMENT_RELEASES_SLACK_WEBHOOK_URL }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,body)

          # The changes, from the release-please changelog, as Slack bullets. Each line keeps its
          # PR link, but drops the commit link and the "**component:**" prefix.
          changes=$(jq -r .body <<< "$release" | grep '^\* ' \
            | sed -E 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' \
            | sed -E 's/ \(\[[0-9a-f]{7,}\]\([^)]+\)\)$//; s/^\* \*\*[^*]+:\*\* /• /; s/^\* /• /' \
            | sed -E 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g' || true)

          # How long since the newest PR in this release merged.
          newest_pr="" newest_merged_at=0
          for number in $(jq -r .body <<< "$release" | grep -oE '\[#[0-9]+\]' | tr -d '[]#' | sort -u); do
            merged_at=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json mergedAt --jq '.mergedAt // empty')
            if [ -n "$merged_at" ] && [ "$(date -d "$merged_at" +%s)" -gt "$newest_merged_at" ]; then
              newest_pr="$number"
              newest_merged_at=$(date -d "$merged_at" +%s)
            fi
          done
          took=""
          if [ -n "$newest_pr" ]; then
            seconds=$(( $(date +%s) - newest_merged_at ))
            took=", $(( seconds / 60 ))m $(( seconds % 60 ))s after #$newest_pr merged"
          fi

          # ghcr.io/<owner>/<name> has its page at github.com/orgs/<owner>/packages/container/package/<name>.
          owner_and_name="${IMAGE#ghcr.io/}"
          image_url="https://github.com/orgs/${owner_and_name%%/*}/packages/container/package/${owner_and_name#*/}"

          message=":rocket: *$COMPONENT v$VERSION is out*$took
          ${changes:-• No changes listed.}
          <$(jq -r .url <<< "$release")|Release> · <$image_url|Image>"
          # The release is published by now, so a Slack problem must not fail the job.
          curl -sSf -X POST -H 'Content-type: application/json' --data "$(jq -n --arg text "$message" '{text: $text}')" "$WEBHOOK" \
            || echo "::warning::Could not post to Slack."

      - name: Tell the experiment channel the publish failed
        if: failure()
        env:
          WEBHOOK: ${{ secrets.EXPERIMENT_RELEASES_SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          message=":octagonal_sign: *$COMPONENT $TAG did not publish*
          The tag exists, but the image or release files may be missing. Fix the cause, then publish $TAG again by hand from \`main\`. Re-running this run reuses the old workflow. <$RUN_URL|Run log>"
          curl -sSf -X POST -H 'Content-type: application/json' --data "$(jq -n --arg text "$message" '{text: $text}')" "$WEBHOOK"
